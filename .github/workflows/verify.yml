name: Verify Pull Requests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Set up Bun.sh
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        uses: borales/actions-yarn@v5
        with:
          cmd: install

      - name: Run tests
        run: npx lerna exec bun run test

      - name: Check types
        run: npx lerna run typecheck

      - name: Build packages
        run: npx lerna run build

      - name: Verify rubles package
        run: npm pack --dry-run ./packages/rubles
